# The example programs of this module's decks are tangled from the decks'
# contents.nw and piped through black by the tangle rule (noweb.mk).  The
# course teaches PEP 8, whose line limit is 79 characters, and a few of the
# tangled lines would otherwise be joined by black to 80--88 characters;
# black reads this file for every path below modules/classes/, so the make
# rule and a manual `black --check examples/` agree.
[tool.black]
line-length = 79
