# The example programs of this module's tutorial deck are tangled from
# tutorial/contents.nw and piped through black by the tangle rule
# (noweb.mk).  The course teaches PEP 8, whose line limit is 79
# characters, and a few of the tangled lines would otherwise be joined by
# black to 80--88 characters, so the program in examples/ would no longer
# be byte for byte the program shown on the slides.  black reads this file
# for every path below modules/graphics/, so the make rule and a manual
# `black --check examples/` agree.  Same file, same reason, as
# modules/classes/pyproject.toml.
[tool.black]
line-length = 79
